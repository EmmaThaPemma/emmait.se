---
layout: default
permalink: /blog/
title: Blog
---
<section class="section">
  <h2 class="section-title">Blog</h2>
  <div class="projects-grid">
    {% for post in site.posts %}
    <a href="{{ post.url | relative_url }}" class="project-card glass">
      <span class="project-tag">{{ post.date | date: "%Y-%m-%d" }}</span>
      <h3>{{ post.title }}</h3>
      <p>{{ post.excerpt | strip_html | truncate: 140 }}</p>
    </a>
    {% endfor %}
  </div>
</section>
