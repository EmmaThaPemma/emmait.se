<header class="navbar glass">
  <a href="/" class="logo-link">
    <img src="/img/logo.png" alt="Emma IT" class="site-logo" width="920" height="162">
  </a>

  <nav class="desktop-nav" aria-label="Site navigation">
    <a href="/#home"    class="nav-link" data-sv="Hem"     data-en="Home"    data-nl="Thuis">Home</a>
    <a href="/#about"   class="nav-link" data-sv="Om mig"  data-en="About"   data-nl="Over mij">About</a>
    <a href="/blog/"    class="nav-link" data-sv="Blogg"   data-en="Blog"    data-nl="Blog">Blog</a>
    <a href="/#contact" class="nav-link" data-sv="Kontakt" data-en="Contact" data-nl="Contact">Contact</a>
  </nav>

  <form action="https://duckduckgo.com/" method="get" class="navbar-search" role="search">
    <input
      type="search"
      name="q"
      class="navbar-search-input"
      autocomplete="off"
      spellcheck="false"
      {% if page.url == "/" %}autofocus{% endif %} <!-- This sets the cursor to the search bar -->
      aria-label="Search or enter address"
      aria-autocomplete="list"
      aria-controls="search-suggestions"
      aria-expanded="false">
    <ul id="search-suggestions" class="search-suggestions glass" role="listbox" hidden></ul>
  </form>

  <div class="nav-controls">
    <button class="lang-toggle" aria-label="Switch language">SV</button>
    <div class="hue-wrap">
      <input type="range" id="hue-slider" class="hue-slider" min="0" max="360" value="0" aria-label="Colour theme">
    </div>
    <a href="https://github.com/EmmaThaPemma" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
      <img src="/img/github.svg" alt="GitHub" class="social-icon">
    </a>
    <a href="https://www.linkedin.com/in/emma-it/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
      <img src="/img/linkedin.svg" alt="LinkedIn" class="social-icon">
    </a>
  </div>

  <button class="hamburger" aria-label="Open menu" aria-expanded="false">☰</button>
</header>
